<!DOCTYPE html>
<html>

<head>
    <title>CGOL</title>
    <style>
        body {
            font-family: monospace;
            margin: 20px;
        }

        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 20px;
        }

        input {
            margin-bottom: 10px;
            padding: 8px;
            width: 5em;
        }

        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        canvas {
            border: 1px solid black;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>Run CGOL</h1>
    <h2>Canvas Grid:</h2>
    <canvas id="canvas"></canvas>
    <br>

    <button onclick="runBinary()">Run once</button>
    <label>Time in MS</label>
    <input id="timer_time" value="1000" type="number" />
    <button onclick="toggleTimer()">Timer</button>
    <select id="binaryPath">
        <option value="../go/bin/cgol">Go</option>
        <option value="../c/bin/cgol">C</option>
        <option value="../zig/bin/cgol">Zig</option>
    </select>
    <script>
        let board = [];
        let timeoutId;
        let timerEnabled = false;

        function drawBoard(board) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            const cellSize = 20;
            const rows = board.length;
            const cols = board[0].length;

            canvas.width = cols * cellSize;
            canvas.height = rows * cellSize;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (board[y][x] === 1) {
                        ctx.fillStyle = 'black';
                    } else {
                        ctx.fillStyle = 'white';
                    }

                    ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);

                    ctx.strokeStyle = 'gray';
                    ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }
        }

        function parseBoard(input) {
            const rows = input.split('\n').map(row => row.trim()).filter(row => row.length > 0);
            const board = rows.map(row => row.split('').map(cell => parseInt(cell, 10)));
            return board;
        }

        function boardTostring(board) {
            return board.map(row => row.join('') + "\n").join('');
        }

        function toggleTimer() {
            if (timerEnabled) {
                timerEnabled = false;
                clearTimeout(timeoutId);
                timeoutId = undefined;
            } else {
                timerEnabled = true;
                runBinaryWithTimer();
            }
        }

        function runBinaryWithTimer() {
            if (!timerEnabled) return;

            const startTime = performance.now();

            runBinary().then(() => {
                const elapsedTime = performance.now() - startTime;
                const interval_MS = parseInt(document.getElementById('timer_time').value, 10);

                if (elapsedTime >= interval_MS) {
                    runBinaryWithTimer();
                } else {
                    timeoutId = setTimeout(runBinaryWithTimer, interval_MS - elapsedTime);
                }
            });
        }

        async function runBinary() {
            const binaryPath = document.getElementById('binaryPath').value;

            const formData = new FormData();
            formData.append('binary_path', binaryPath);
            formData.append('board', boardTostring(board));

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "Unknown error");
                }

                const data = await response.text();
                board = parseBoard(data);
                drawBoard(board);

            } catch (error) {
                console.error(`Error: ${error.message}`);
            }
        }

        const inputContent = `{{ input_content }}`;
        board = parseBoard(inputContent);
        drawBoard(board);
    </script>

</body>

</html>
